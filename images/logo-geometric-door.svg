<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="blueGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>

    <linearGradient id="cyanGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="silverGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- LOGO ICON MARK (Geometric Interlocking Door/Window Panels) -->
  <g transform="translate(10, 10)">
    <!-- Base Shield / Frame Container -->
    <rect x="4" y="4" width="92" height="92" rx="16" fill="#0F172A" stroke="url(#cyanGrad2)" stroke-width="2" filter="url(#shadow2)"/>
    
    <!-- Left Sliding Door / S-Panel (3D Isometric Perspective) -->
    <path d="M 24 24 H 56 L 36 50 H 68 L 48 76 H 24 L 38 50 Z" fill="url(#cyanGrad2)"/>

    <!-- Right Folding Door / V-Panel (Overlapping Glass Panel) -->
    <path d="M 44 24 L 76 24 L 60 76 L 44 76 L 54 46 Z" fill="url(#blueGrad2)" opacity="0.9"/>
    
    <!-- Glass Cutout / Light Reflection Lines -->
    <polygon points="30,28 48,28 38,42 26,42" fill="url(#silverGrad2)" opacity="0.35"/>
    <polygon points="42,54 60,54 50,68 38,68" fill="url(#silverGrad2)" opacity="0.35"/>

    <!-- Thermal Break Center Line (Precision Accent) -->
    <line x1="50" y1="16" x2="50" y2="84" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Door Handle Point -->
    <circle cx="62" cy="50" r="3" fill="#FFFFFF"/>
  </g>

  <!-- LOGO TYPOGRAPHY -->
  <g transform="translate(125, 32)">
    <text x="0" y="34" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="35" font-weight="800" letter-spacing="-0.5" fill="#0F172A">
      Swan
    </text>
    
    <text x="0" y="58" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#0284C7">
      ARCHITECTURAL DOORS &amp; WINDOWS
    </text>
    
    <text x="310" y="58" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1" fill="#64748B">
      EST. PERTH
    </text>
    
    <line x1="0" y1="70" x2="415" y2="70" stroke="url(#cyanGrad2)" stroke-width="1.5" opacity="0.7"/>
  </g>
</svg>
