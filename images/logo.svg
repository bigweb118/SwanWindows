<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>

    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.1" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- LOGO ICON MARK (Sun Horizon opening through French Doors) -->
  <g transform="translate(10, 10)">
    <rect x="4" y="4" width="92" height="92" rx="16" fill="url(#darkBg)" stroke="url(#amberGrad)" stroke-width="2.5" filter="url(#shadow)"/>
    <path d="M 12 68 Q 50 38 88 68 L 88 88 H 12 Z" fill="url(#sunGrad)"/>
    <circle cx="50" cy="52" r="16" fill="url(#amberGrad)" opacity="0.85"/>
    <rect x="16" y="16" width="30" height="68" rx="4" stroke="url(#amberGrad)" stroke-width="2" fill="none"/>
    <rect x="54" y="16" width="30" height="68" rx="4" stroke="url(#amberGrad)" stroke-width="2" fill="none"/>
    <line x1="42" y1="46" x2="42" y2="56" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="58" y1="46" x2="58" y2="56" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 32 64 C 40 56, 52 50, 68 54" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- LOGO TYPOGRAPHY -->
  <g transform="translate(125, 32)">
    <text x="0" y="34" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5" fill="#18181B">
      Swan
    </text>
    <text x="0" y="58" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#D97706">
      PREMIUM WINDOW &amp; DOOR SYSTEMS
    </text>
    <text x="310" y="58" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1" fill="#71717A">
      THERMAL BREAK
    </text>
    <line x1="0" y1="70" x2="415" y2="70" stroke="url(#amberGrad)" stroke-width="1.5"/>
  </g>
</svg>
