<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="titaniumGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="50%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="goldAccent4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <linearGradient id="chromeGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5E7EB" />
      <stop offset="50%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>

    <filter id="shadow4" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- LOGO ICON MARK (Multi-Chamber Aluminum Thermal Profile Monogram) -->
  <g transform="translate(10, 10)">
    <!-- Main Chamfered Frame Container -->
    <path d="M 16 4 H 84 L 96 16 V 84 L 84 96 H 16 L 4 84 V 16 Z" fill="url(#titaniumGrad4)" stroke="url(#goldAccent4)" stroke-width="2.5" filter="url(#shadow4)"/>

    <!-- Aluminum Profile Multi-chamber Internal Paths ('S' & 'V' Profile Cut) -->
    <!-- S Profile Chamber -->
    <path d="M 28 26 H 72 V 42 H 44 V 58 H 72 V 74 H 28" fill="none" stroke="url(#goldAccent4)" stroke-width="4.5" stroke-linecap="square" stroke-linejoin="miter"/>
    
    <!-- V Profile Interlocking Thermal Break -->
    <path d="M 38 34 L 50 66 L 62 34" fill="none" stroke="url(#chromeGrad4)" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>

    <!-- Thermal Break Insulation Bar Pins (Dots) -->
    <circle cx="50" cy="22" r="3.5" fill="#EAB308"/>
    <circle cx="50" cy="78" r="3.5" fill="#EAB308"/>
    <circle cx="22" cy="50" r="2.5" fill="#FFFFFF"/>
    <circle cx="78" cy="50" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- LOGO TYPOGRAPHY -->
  <g transform="translate(125, 32)">
    <text x="0" y="34" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="35" font-weight="800" letter-spacing="-0.5" fill="#111827">
      Swan
    </text>
    
    <text x="0" y="58" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#CA8A04">
      THERMALLY BROKEN ALUMINIUM
    </text>
    
    <text x="310" y="58" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1" fill="#6B7280">
      GERMAN CRAFT
    </text>
    
    <line x1="0" y1="70" x2="415" y2="70" stroke="url(#goldAccent4)" stroke-width="1.5"/>
  </g>
</svg>
